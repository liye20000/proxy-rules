name: generate

# 仅在主源或脚本/工作流自身改动时触发,避免 v2rayn-rules.json 改动再次触发(死循环)
on:
  pull_request:
    paths:
      - "proxy-list.txt"
      - "proxy-ip-list.txt"
      - "proxy-ip-auto.txt"
      - "generate.py"
      - "fetch_telegram_ips.py"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "proxy-list.txt"
      - "proxy-ip-list.txt"
      - "generate.py"
      - "fetch_telegram_ips.py"
      - "tests/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

# 两个会写回仓库的工作流共用同一把锁,避免同时推送。
concurrency:
  group: proxy-rules-writer
  cancel-in-progress: false

# 允许 Actions 把重新生成的 JSON 提交回仓库
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Generate rule files
        run: python generate.py

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Verify generated files are committed
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- v2rayn-rules.json shadowrocket.conf shadowrocket.module

      - name: Commit and push if changed
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2rayn-rules.json shadowrocket.conf shadowrocket.module
          if git diff --cached --quiet; then
            echo "生成结果无变化,跳过提交"
          else
            git commit -m "auto: 重新生成规则文件(v2rayn-rules.json / shadowrocket.conf / shadowrocket.module)"
            git push
          fi
